name: Project CI

on:
  pull_request:
    paths:
      - 'apps/worker/**'
      - 'apps/web/**'
      - 'packages/db/**'
      - 'packages/sdk/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/web/**'
      - 'packages/db/**'
      - 'packages/sdk/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check migration safety and numbering
        run: pnpm tsx scripts/check-migrations.ts
      - name: Run all unit tests
        run: pnpm test
      - name: Typecheck workspaces
        run: pnpm --filter worker --filter web --filter @line-crm/db --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-harness/sdk --filter @line-harness/update-engine typecheck
      - name: Build shared packages and SDKs
        run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-harness/update-engine --filter @line-harness/sdk build
      - name: Build Worker
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}
      - name: Build Admin
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: https://ci.invalid
          APP_BUILD_TIME: '1970-01-01T00:00:00Z'
