name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# デフォルト = テスト環境
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "68bcd974bcb0b8d5a23e721d7d3a124b"

[assets]
directory = "dist/client"
binding = "ASSETS"
# Worker を先に走らせて bot UA → OGP HTML 差し込みを可能にする。
# 通常 UA のときは Worker の notFound 内で c.env.ASSETS.fetch(req) を呼んで
# SPA を返す。これが無いと static asset path が Worker をバイパスして
# 直接配信され、bot 判定が効かない。
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "e6ddb47e-dce8-4cbd-ba14-e512209fc6f2"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[triggers]
crons = ["* * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# Phase 5 self-update vars — consumed by /admin/update/*. Secrets
# (CF_API_TOKEN, ADMIN_API_KEY) must be set via `wrangler secret put`
# and are intentionally absent from this file.
# 注: [env.production] には意図的に置かない。本番は GitHub Actions デプロイ
# 運用のため self-update は使わず、vars/secrets 不在で route は実行時ガードで
# 不活性になる (本番挙動を変えないための判断, 2026-07-07)。
# ═══════════════════════════════════════════════════════════════
# LOG_RETENTION_DAYS: days to keep messages_log rows (archived to R2 first).
# Unset = keep forever (default). Set per-deployment, not here.
[vars]
WORKER_NAME = "line-harness"
ADMIN_PAGES_PROJECT = "line-harness-admin"
LIFF_PAGES_PROJECT = "line-harness-liff"
D1_DATABASE_ID = "e6ddb47e-dce8-4cbd-ba14-e512209fc6f2"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://line-harness.kataokamasanori.workers.dev"
ADMIN_PUBLIC_URL = "https://line-harness-admin.pages.dev"
LIFF_PUBLIC_URL = "https://line-harness-liff.pages.dev"
CF_ACCOUNT_ID = "68bcd974bcb0b8d5a23e721d7d3a124b"
IEMOTO_BOT_ENABLED = "true"
IEMOTO_BOT_BASE_URL = "https://iemoto.oreyu-ai.jp"
IEMOTO_LINE_ACCOUNT_ID = "b10764f3-521e-4b0c-81a3-e91a5c9e2c87"

# ═══════════════════════════════════════════════════════════════
# 本番環境
# 使い方: npx wrangler deploy --env production --name your-worker-name
# D1:     npx wrangler d1 execute your-database --env production --remote --file ...
# ═══════════════════════════════════════════════════════════════
[env.production]
account_id = "68bcd974bcb0b8d5a23e721d7d3a124b"

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "e6ddb47e-dce8-4cbd-ba14-e512209fc6f2"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[env.production.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# Phase 5 self-update vars for production. Worker / Pages / D1 names point at
# the prod resources. Secrets (CF_API_TOKEN, ADMIN_API_KEY) live in the
# production secret store, set via `wrangler secret put --env production`.
[env.production.vars]
WORKER_NAME = "line-harness"
ADMIN_PAGES_PROJECT = "line-harness-admin"
LIFF_PAGES_PROJECT = "line-harness-liff"
D1_DATABASE_ID = "e6ddb47e-dce8-4cbd-ba14-e512209fc6f2"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://line-harness.kataokamasanori.workers.dev"
ADMIN_PUBLIC_URL = "https://line-harness-admin.pages.dev"
LIFF_PUBLIC_URL = "https://line-harness-liff.pages.dev"
CF_ACCOUNT_ID = "68bcd974bcb0b8d5a23e721d7d3a124b"
IEMOTO_BOT_ENABLED = "true"
IEMOTO_BOT_BASE_URL = "https://iemoto.oreyu-ai.jp"
IEMOTO_LINE_ACCOUNT_ID = "b10764f3-521e-4b0c-81a3-e91a5c9e2c87"
