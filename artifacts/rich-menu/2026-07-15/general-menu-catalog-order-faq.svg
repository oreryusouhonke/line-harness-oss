<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="843" viewBox="0 0 2500 843">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#efe7dc"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c211b"/>
      <stop offset="1" stop-color="#603d2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2b1d15" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="2500" height="843" fill="#e6ddd2"/>

  <g filter="url(#shadow)">
    <rect x="18" y="18" width="797" height="807" rx="30" fill="url(#bg)"/>
    <rect x="851" y="18" width="798" height="807" rx="30" fill="url(#primary)"/>
    <rect x="1685" y="18" width="797" height="807" rx="30" fill="url(#bg)"/>
  </g>

  <!-- shopping bag -->
  <g transform="translate(415 225)" fill="none" stroke="#713921" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-122 10h244l-18 235h-208z" fill="#fff9f0"/>
    <path d="M-66 30v-57c0-50 28-82 66-82s66 32 66 82v57"/>
  </g>

  <!-- order clipboard -->
  <g transform="translate(1250 225)" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-122" y="-92" width="244" height="320" rx="18" fill="#ffffff" fill-opacity=".08"/>
    <rect x="-52" y="-125" width="104" height="66" rx="18" fill="#d2aa71" stroke="#d2aa71"/>
    <path d="M-66 30h132M-66 92h132"/>
    <path d="M-57 160l34 34 78-88" stroke="#d2aa71" stroke-width="28"/>
  </g>

  <!-- question -->
  <g transform="translate(2083 225)" fill="none" stroke="#713921" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <circle r="150" fill="#fff9f0"/>
    <path d="M-62-45c10-60 116-72 126 0 7 50-64 63-64 118"/>
    <circle cy="138" r="13" fill="#713921" stroke="none"/>
  </g>

  <g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif" text-anchor="middle">
    <text x="416" y="600" fill="#231b17" font-size="74" font-weight="800">商品を見る</text>
    <text x="416" y="668" fill="#806f63" font-size="34" font-weight="600">一般向け商品カタログ</text>

    <text x="1250" y="600" fill="#ffffff" font-size="80" font-weight="800">注文方法</text>
    <text x="1250" y="672" fill="#e8d8ca" font-size="36" font-weight="600">ご注文の流れを確認</text>

    <text x="2083" y="600" fill="#231b17" font-size="74" font-weight="800">よくある質問</text>
    <text x="2083" y="668" fill="#806f63" font-size="34" font-weight="600">価格・デザイン・納期</text>
  </g>
</svg>
